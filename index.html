<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Doomsday Décompte</title>
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Calendrier de l'avent Avengers: Doomsday">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="icons/icon.svg" alt="" class="logo">
    <h1>DOOMSDAY</h1>
    <p class="sub">Compte à rebours</p>
    <div id="countdown" class="countdown">
      <div><span id="cd-j">--</span><small>jours</small></div>
      <div><span id="cd-h">--</span><small>heures</small></div>
      <div><span id="cd-m">--</span><small>min</small></div>
      <div><span id="cd-s">--</span><small>sec</small></div>
    </div>
    <p id="next" class="next"></p>
  </header>

  <main id="grid" class="grid"></main>

  <button id="install" class="install" hidden>Installer l'app</button>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <p id="modal-day" class="modal-day"></p>
      <h2 id="modal-title"></h2>
      <a id="modal-link" class="btn" target="_blank" rel="noopener">Voir la vidéo</a>
      <button id="modal-close" class="close" aria-label="Fermer">✕</button>
    </div>
  </div>

  <script src="videos.js"></script>
  <script src="app.js"></script>
</body>
</html>
